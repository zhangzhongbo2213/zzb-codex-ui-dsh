# Personal preferences only. Paths and optional MCP entries are generated on install.
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"
check_for_update_on_startup = false
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

[tui]
screen_reader_detection_done = true
status_line_use_colors = true
status_line = ["model-with-reasoning", "current-dir", "thread-name", "run-state", "context-used", "weekly-limit", "used-tokens", "fast-mode"]
