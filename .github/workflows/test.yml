name: portable-setup
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null 2>&1; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
      - run: python -m unittest discover -s ui -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repo.py
